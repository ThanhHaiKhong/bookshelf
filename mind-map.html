<style>
  :root {
    --bg: #e9f2f2;
    --surface: #f8fcfb;
    --surface-strong: #ffffff;

    --amber: #bd741c;
    --amber-soft: #f4e7cf;
    --leaf: #688c3d;
    --leaf-soft: #e2edd5;
    --shadow: 0 22px 60px rgba(21, 70, 72, 0.12);
    --display: "Noto Serif", Georgia, serif;
    --body: "Be Vietnam Pro", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #071a1c;
      --surface: #0e2527;
      --surface-strong: #143033;
      --ink: #e7f4f0;
      --muted: #a3bfbb;
      --line: #2b4b4c;
      --teal: #61cbc2;
      --teal-soft: #143d3b;
      --blue: #84b9dd;
      --blue-soft: #172f42;
      --amber: #f1b65e;
      --amber-soft: #46351e;
      --leaf: #b4d17a;

      --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }
  }

  :root[data-theme="dark"] {
    --bg: #071a1c;
    --surface: #0e2527;
    --surface-strong: #143033;
    --ink: #e7f4f0;
    --muted: #a3bfbb;
    --line: #2b4b4c;
    --teal: #61cbc2;
    --teal-soft: #143d3b;
    --blue: #84b9dd;
    --blue-soft: #172f42;
    --amber: #f1b65e;
    --amber-soft: #46351e;
    --leaf: #b4d17a;
    --leaf-soft: #293b24;

  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);

    overflow: hidden;
  }

  a { color: var(--teal); }

  a:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--amber);
    outline-offset: 4px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 14px clamp(16px, 3vw, 32px);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  .book-label {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.74rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .book-label::before {
    content: "";
    width: 28px;
    height: 2px;
    background: var(--teal);
  }

  .topbar-links {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.82rem;
    font-weight: 600;
  }

  .topbar-links a { text-decoration: none; }
  .topbar-links a:hover { text-decoration: underline; }

  .hint {
    padding: 8px clamp(16px, 3vw, 32px);
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--teal-soft) 55%, transparent);
    color: var(--muted);
    font-size: 0.78rem;
  }

  #map {
    flex: 1;
    min-height: 0;
    width: 100%;
  }

  /* mind-elixir surface follows the page palette */
  .map-container { background: var(--bg) !important; }

  /* ===== Detail popup ===== */
  .detail-backdrop {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: color-mix(in srgb, var(--ink) 34%, transparent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }

  .detail-panel {
    position: fixed;
    z-index: 50;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(430px, 100%);
    display: flex;
    flex-direction: column;
    gap: 0;
    border-left: 1px solid var(--line);
    background: var(--surface-strong);
    box-shadow: var(--shadow);
    transform: translateX(105%);
    transition: transform 0.22s ease;
  }

  body.detail-open .detail-backdrop { opacity: 1; pointer-events: auto; }
  body.detail-open .detail-panel { transform: translateX(0); }

  .detail-head {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: start;
    padding: 24px 24px 0;
  }

  .detail-emoji { font-size: 2rem; line-height: 1; }

  .detail-head h2 {
    margin: 10px 0 4px;
    font-family: var(--display);
    font-size: 1.6rem;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .detail-term {
    color: var(--muted);
    font: 500 0.72rem var(--mono);
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .detail-close {
    width: 40px;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
  }

  .detail-close:hover { color: var(--ink); border-color: var(--teal); }

  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .detail-body p { margin: 0 0 12px; }

  .detail-breadcrumb {
    margin-bottom: 14px;
    padding: 10px 14px;
    border-left: 3px solid var(--part-accent, var(--teal));
    background: color-mix(in srgb, var(--part-soft, var(--teal-soft)) 70%, transparent);
    color: var(--ink);
    font-size: 0.8rem;
  }

  .detail-foot {
    display: grid;
    gap: 10px;
    padding: 16px 24px 24px;
    border-top: 1px solid var(--line);
  }

  .detail-link {
    display: inline-block;
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--surface);
    text-align: center;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.88rem;
  }

  .detail-link:hover { opacity: 0.9; }

  @media (max-width: 620px) {
    .topbar { flex-direction: column; align-items: stretch; gap: 8px; }
    .detail-panel {
      top: auto;
      left: 0;
      width: 100%;
      max-height: 72vh;
      border-left: 0;
      border-top: 1px solid var(--line);
      border-radius: 22px 22px 0 0;
      transform: translateY(105%);
    }
    body.detail-open .detail-panel { transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .detail-panel, .detail-backdrop { transition: none; }
  }
</style>

<script>
(function () {
  "use strict";

  const P1 = "system-structure-and-behavior.html";
  const P2 = "systems-and-us.html";
  const P3 = "creating-change.html";

  let idCounter = 0;
  function n(topic, detail, children) {
    const node = { id: "n" + (++idCounter), topic };
    if (detail) node.detail = detail;
    if (children && children.length) node.children = children;
    return node;
  }

  // ===== Part 1 — System Structure and Behavior =====
  const part1 = n("🧱 Phần 1 · Cấu trúc & hành vi", {
    term: "Part One · System Structure and Behavior",
    part: 1,
    summary: "Chương 1–2 dựng ngôn ngữ nền tảng của tư duy hệ thống: hệ thống là gì, stocks và flows, các vòng phản hồi — rồi tham quan “sở thú hệ thống” để thấy vài cấu trúc mẫu sinh ra những hành vi quen thuộc quanh ta.",
    href: P1
  }, [
    n("🧩 Hệ thống là gì?", {
      term: "Elements · Interconnections · Purpose",
      part: 1,
      summary: "Một hệ thống gồm ba thứ: các phần tử, các liên kết giữa chúng, và một mục đích. Đổi phần tử thường ít ảnh hưởng; đổi liên kết hoặc mục đích là đổi cả hệ thống. Mục đích thật của hệ được suy ra từ hành vi của nó, không phải từ khẩu hiệu.",
      href: P1 + "#chapter-1"
    }),
    n("🛁 Stocks & Flows", {
      term: "Stocks and Flows",
      part: 1,
      summary: "Stock là lượng tích lũy đo được tại một thời điểm (nước trong bồn, tiền trong tài khoản, niềm tin trong nhóm); flow là dòng chảy vào và ra làm stock đổi theo thời gian. Stock chỉ đổi qua flow — không có đường tắt — nên stock là bộ nhớ của hệ thống và tạo quán tính, độ trễ.",
      href: P1 + "#stocks"
    }),
    n("♻️ Vòng cân bằng", {
      term: "Balancing Feedback Loop",
      part: 1,
      summary: "Vòng phản hồi giữ stock quanh một mục tiêu: lệch khỏi đích thì hành động kéo về (nhiệt kế bật lò sưởi khi lạnh, cơ thể tự hạ sốt). Vòng cân bằng tạo ổn định và sức chống đỡ, nhưng chỉ mạnh bằng mắt xích yếu nhất của nó.",
      href: P1 + "#loops"
    }),
    n("🚀 Vòng củng cố", {
      term: "Reinforcing Feedback Loop",
      part: 1,
      summary: "Vòng phản hồi tự khuếch đại: càng nhiều càng sinh thêm (lãi kép, dân số, tin đồn). Nó tạo tăng trưởng lũy thừa hoặc sụp đổ tăng tốc — và không tăng trưởng nào là mãi mãi: sớm muộn một vòng cân bằng nào đó sẽ vào cuộc.",
      href: P1 + "#loops"
    }),
    n("7️⃣0️⃣ Quy tắc 70", {
      term: "Doubling Time — Rule of 70",
      part: 1,
      summary: "Ước lượng nhanh thời gian nhân đôi của tăng trưởng lũy thừa: lấy 70 chia cho tốc độ tăng phần trăm mỗi kỳ. Tăng 7%/năm thì khoảng 10 năm nhân đôi. Công cụ bỏ túi để cảm nhận sức mạnh của vòng củng cố.",
      href: P1 + "#loops"
    }),
    n("🦁 Sở thú hệ thống", {
      term: "A Brief Visit to the Systems Zoo",
      part: 1,
      summary: "Chương 2 trưng bày các “con thú” — những cấu trúc mẫu ít stock và vài vòng phản hồi — xuất hiện lặp đi lặp lại khắp nơi. Học thuộc vài con thú là đọc được hành vi của rất nhiều hệ thống thật.",
      href: P1 + "#chapter-2"
    }, [
      n("🌡️ Nhiệt kế", {
        term: "One Stock, Two Balancing Loops",
        part: 1,
        summary: "Một stock (nhiệt độ phòng) bị hai vòng cân bằng kéo về hai phía: lò sưởi kéo lên đích, khe hở rò nhiệt kéo xuống ngoài trời. Hành vi cuối là kết quả giằng co giữa các vòng — muốn giữ đích phải bù cả phần rò rỉ.",
        href: P1 + "#chapter-2"
      }),
      n("👥 Dân số & vốn", {
        term: "Population & Industrial Capital — Shifting Dominance",
        part: 1,
        summary: "Một stock có cả vòng củng cố (sinh sản, đầu tư) lẫn vòng cân bằng (tử vong, khấu hao). Vòng nào trội hơn quyết định tăng hay giảm — và ưu thế có thể đổi bên theo thời gian, làm hành vi hệ đổi hẳn dạng.",
        href: P1 + "#chapter-2"
      }),
      n("🚗 Tồn kho ô tô & độ trễ", {
        term: "Inventory with Delays — Oscillation",
        part: 1,
        summary: "Đại lý xe giữ tồn kho làm bộ đệm, nhưng ba lớp trễ — nhận thức, phản ứng, giao hàng — biến việc sửa lệch thành dao động quá đà rồi quá thiếu. Bài học trái trực giác: phản ứng nhanh hơn có thể làm dao động tệ hơn; đổi độ trễ là đổi hẳn hành vi hệ.",
        href: P1 + "#chapter-2"
      }),
      n("🛢️ Tài nguyên không tái tạo", {
        term: "Nonrenewable Resource Constraint",
        part: 1,
        summary: "Vốn khai thác tăng theo vòng củng cố nhưng bị stock tài nguyên hữu hạn (mỏ dầu) chặn lại: sản lượng lên đỉnh rồi tụt khi tài nguyên cạn. Khai thác nhanh gấp đôi chủ yếu làm đỉnh đến sớm hơn, không làm tài nguyên nhiều thêm.",
        href: P1 + "#chapter-2"
      }),
      n("🎣 Tài nguyên tái tạo", {
        term: "Renewable Resource — Three Fates",
        part: 1,
        summary: "Ngư trường tự tái sinh nhưng tốc độ tái sinh phụ thuộc chính stock cá. Tùy sức khai thác và độ nhạy của phản hồi, hệ có ba số phận: ổn định bền vững, dao động, hoặc sụp đổ kéo theo cả đội tàu. Chìa khóa là giữ stock trên ngưỡng tái sinh.",
        href: P1 + "#chapter-2"
      })
    ]),
    n("🧬 Cấu trúc sinh hành vi", {
      term: "Structure Generates Behavior",
      part: 1,
      summary: "Tổng kết Phần 1: những hệ thống khác lĩnh vực nhưng cùng cấu trúc vòng phản hồi sẽ hành xử giống nhau (đẳng cấu). Nhìn thấy cấu trúc là đoán được dạng hành vi — trước khi nó xảy ra.",
      href: P1 + "#application"
    })
  ]);

  // ===== Part 2 — Systems and Us =====
  const part2 = n("🌀 Phần 2 · Hệ thống & chúng ta", {
    term: "Part Two · Systems and Us",
    part: 2,
    summary: "Chương 3–5 trả lời ba câu hỏi: vì sao hệ thống vận hành tốt đến vậy (kháng nhiễu, tự tổ chức, phân tầng), vì sao chúng vẫn liên tục làm ta bất ngờ, và tám cái bẫy cấu trúc mà cả người tốt cũng rơi vào.",
    href: P2
  }, [
    n("💪 Vì sao vận hành tốt", {
      term: "Chapter 3 · Why Systems Work So Well",
      part: 2,
      summary: "Ba đặc tính làm hệ thống tốt đến kinh ngạc: kháng nhiễu, tự tổ chức và phân tầng. Cả ba thường vô hình khi đang hoạt động — nên hay bị hy sinh nhân danh hiệu suất ngắn hạn.",
      href: P2 + "#chapter-3"
    }, [
      n("🛡️ Kháng nhiễu", {
        term: "Resilience",
        part: 2,
        summary: "Khả năng hồi phục sau cú sốc, đến từ nhiều vòng phản hồi dự phòng hoạt động theo những cách khác nhau. Kháng nhiễu khác ổn định tĩnh: hệ kháng nhiễu có thể dao động mà vẫn sống sót. Nó vô hình cho đến khi bị vượt ngưỡng — nên thường bị cắt bỏ nhầm.",
        href: P2 + "#chapter-3"
      }),
      n("🌱 Tự tổ chức", {
        term: "Self-organization",
        part: 2,
        summary: "Năng lực tự làm cấu trúc của mình phức tạp hơn: học, tiến hóa, đa dạng hóa. Đây là sức mạnh lớn nhất của hệ sống — và thường bị hy sinh để đổi lấy năng suất, kiểm soát, đồng nhất ngắn hạn.",
        href: P2 + "#chapter-3"
      }),
      n("🏛️ Phân tầng", {
        term: "Hierarchy",
        part: 2,
        summary: "Hệ ổn định thường tiến hóa từ dưới lên thành các tầng lồng nhau; tầng trên tồn tại để phục vụ tầng dưới, không phải ngược lại. Phân tầng lành mạnh giảm chi phí thông tin; bệnh của nó là tối ưu cục bộ (suboptimization) hoặc trung ương kiểm soát quá tay.",
        href: P2 + "#chapter-3"
      })
    ]),
    n("😲 Vì sao bất ngờ", {
      term: "Chapter 4 · Why Systems Surprise Us",
      part: 2,
      summary: "Hệ thống làm ta ngã ngửa không phải vì chúng ác ý mà vì mô hình trong đầu ta quá đơn giản: ta mê sự kiện hơn dạng hành vi, quên phi tuyến, vẽ ranh giới sai, bỏ sót tầng giới hạn và độ trễ, rồi quyết định hợp lý trong tầm nhìn hẹp.",
      href: P2 + "#chapter-4"
    }, [
      n("📰 Mê sự kiện", {
        term: "Beguiled by Events",
        part: 2,
        summary: "Ta chú ý cú sốc hôm nay thay vì đồ thị hành vi dài hạn, nên chữa triệu chứng thay vì cấu trúc. Bước đầu của tư duy hệ thống: lùi lại nhìn dạng hành vi theo thời gian.",
        href: P2 + "#chapter-4"
      }),
      n("📈 Phi tuyến", {
        term: "Nonlinearity",
        part: 2,
        summary: "Quan hệ trong hệ thống hiếm khi là đường thẳng: gấp đôi đầu vào có thể chẳng đổi gì — hoặc lật cả hệ sang chế độ khác. Phi tuyến còn đổi cả ưu thế tương đối giữa các vòng phản hồi, nên ngoại suy tuyến tính rất hay sai.",
        href: P2 + "#chapter-4"
      }),
      n("🗺️ Ranh giới", {
        term: "Boundaries",
        part: 2,

  // ===== Part 3 — Creating Change =====
  const part3 = n("🔧 Phần 3 · Tạo thay đổi", {
    term: "Part Three · Creating Change — in Systems and in Our Philosophy",
    part: 3,
    summary: "Chương 6–7 trả lời “vậy can thiệp ở đâu và sống với hệ thống thế nào”: thang mười hai điểm bẩy xếp theo hiệu lực tăng dần, và mười lăm lời khuyên để khiêu vũ cùng những hệ không thể kiểm soát hoàn toàn.",
    href: P3
  }, [
    n("🪜 12 điểm bẩy", {
      term: "Chapter 6 · Leverage Points — Places to Intervene in a System",
      part: 3,
      summary: "Mười hai nơi có thể can thiệp vào một hệ thống, xếp từ yếu (chỉnh tham số) đến mạnh (đổi mô hình tư duy, vượt lên mô hình). Bẩy càng cao hiệu lực càng lớn — và kháng cự càng mạnh; người ta thường biết chỗ bẩy bằng trực giác rồi đẩy sai hướng.",

      n("🔢 Tầng vật chất & tham số", {

        href: P3 + "#ladder"
      }),
      n("🔄 Tầng phản hồi & thông tin", {

        summary: "Bậc 8–4: sức mạnh vòng cân bằng (8), độ khuếch đại vòng củng cố (7), cấu trúc luồng thông tin — ai thấy gì (6), luật chơi (5), và quyền tự tổ chức — khả năng hệ tự đổi cấu trúc của chính nó (4).",

      n("💡 Tầng mục tiêu & mô hình", {

        summary: "Bậc 3–1: mục tiêu của hệ (3), mô hình tư duy sinh ra hệ (2 — đổi được thì mọi bậc dưới đổi theo), và cao nhất: khả năng vượt lên mọi mô hình, giữ tâm thế không bám chấp vào bất kỳ khung nhìn nào (1).",

      }),
      n("⚖️ Bốn quy luật của thang", {
        term: "Reading the Ladder",
        part: 3,

    n("💃 Sống cùng hệ thống", {
      term: "Chapter 7 · Living in a World of Systems",

    }, [
      n("👀 Bắt nhịp trước", {
        term: "Get the Beat of the System",
        part: 3,
        summary: "Trước khi can thiệp, hãy quan sát hành vi của hệ theo thời gian — dữ liệu thật, không phải ấn tượng. Cụm lời khuyên đầu: bắt nhịp hệ, phơi bày mô hình trong đầu ra ánh sáng, và trân trọng — rồi phân phát — thông tin trung thực.",
        href: P3 + "#chapter-7"
      }),
      n("🗣️ Ngôn ngữ & số liệu tử tế", {
        term: "Honor Information & Language",
        part: 3,
        summary: "Dùng ngôn ngữ cẩn trọng, làm giàu nó bằng khái niệm hệ thống; chú ý cả điều quan trọng không đo đếm được, đừng để biến đại diện đo được chiếm chỗ mục đích thật. Người dám nói về chất lượng là người giữ chuẩn cho cả hệ.",
        href: P3 + "#chapter-7"
      }),
      n("🕊️ Khiêm nhường & học hỏi", {
        term: "Stay Humble, Stay a Learner",
        part: 3,
        summary: "Làm chính sách kiểu phản hồi (thiết kế để tự sửa), mở rộng đường thời gian và ranh giới quan tâm, thừa nhận sai nhanh và học bằng thử và sai. Sai lầm được che đậy sẽ lớn thành thảm họa; bước nhỏ cộng phản hồi trung thực là cách đi trong sương mù.",
        href: P3 + "#chapter-7"
      }),
      n("❤️ Giữ điều tốt", {
        term: "Defend Goodness — Don't Erode Goals",
        part: 3,
        summary: "Chăm lo điều tốt đẹp chung, lắng nghe trí khôn có sẵn trong hệ, định vị trách nhiệm đúng chỗ, và tuyệt đối không hạ chuẩn của điều thiện. Sự tử tế cũng là một stock — nó cạn nếu không được bồi đắp.",
        href: P3 + "#chapter-7"
      })
    ])
  ]);

  const data = {
    nodeData: {
      id: "root",
      topic: "📖 Thinking in Systems",
      detail: {
        term: "Donella H. Meadows · Thinking in Systems: A Primer (2008)",
        part: 0,
        summary: "Hành vi của một hệ thống sinh ra từ cấu trúc của chính nó — từ stocks, flows và các vòng phản hồi — chứ không phải từ ý xấu của ai. Hiểu cấu trúc thì đoán được hành vi; đổi cấu trúc đúng chỗ thì đổi được hành vi; và với hệ quá phức tạp, còn phải học cách khiêu vũ cùng nó.",
        href: "index.html"
      },
      children: [part1, part2, part3]
    }
  };

  // ===== Theme: follow the series palette =====
  const css = getComputedStyle(document.documentElement);
  const v = name => css.getPropertyValue(name).trim();
  const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

  const theme = {
    name: "SystemsSeries",
    type: isDark ? "dark" : "light",
    palette: [v("--teal"), v("--blue"), v("--amber"), v("--leaf"), v("--teal"), v("--blue"), v("--amber"), v("--leaf"), v("--teal"), v("--blue")],
    cssVar: {
      "--main-color": v("--ink"),
      "--main-bgcolor": v("--surface-strong"),
      "--color": v("--muted"),
      "--bgcolor": v("--bg"),
      "--panel-color": v("--ink"),
      "--panel-bgcolor": v("--surface-strong"),
      "--panel-border-color": v("--line"),
      "--map-padding": "50px 80px",
      "--root-radius": "26px",
      "--main-radius": "14px",
      "--topic-padding": "4px 10px",
      "--node-gap-x": "32px",
      "--node-gap-y": "12px",
      "--main-gap-x": "70px",
      "--main-gap-y": "22px"
    }
  };

  const ME = MindElixir.default || MindElixir;
  const mind = new ME({
    el: "#map",
    direction: ME.SIDE || MindElixir.SIDE,
    draggable: false,
    editable: false,
    contextMenu: false,
    toolBar: true,
    keypress: false,
    theme
  });
  mind.init(data);

  // ===== Detail popup =====
  const body = document.body;
  const panel = document.getElementById("detail-panel");
  const backdrop = document.getElementById("detail-backdrop");
  const elEmoji = document.getElementById("detail-emoji");
  const elTitle = document.getElementById("detail-title");
  const elTerm = document.getElementById("detail-term");
  const elCrumb = document.getElementById("detail-breadcrumb");
  const elSummary = document.getElementById("detail-summary");
  const elLink = document.getElementById("detail-link");
  const elFoot = document.getElementById("detail-foot");
  const closeBtn = document.getElementById("detail-close");

  const PART_META = {
    0: { label: "Toàn cuốn sách", accent: "--ink", soft: "--teal-soft" },
    1: { label: "Phần 1 · Cấu trúc và hành vi hệ thống", accent: "--teal", soft: "--teal-soft" },
    2: { label: "Phần 2 · Hệ thống và chúng ta", accent: "--blue", soft: "--blue-soft" },
    3: { label: "Phần 3 · Tạo thay đổi", accent: "--amber", soft: "--amber-soft" }
  };

  function splitTopic(topic) {
    const match = topic.match(/^(\p{Extended_Pictographic}[️⃣]*(?:\p{Extended_Pictographic}[️⃣]*)*)\s+(.*)$/u);
    if (match) return { emoji: match[1], text: match[2] };
    return { emoji: "📌", text: topic };
  }

  function openDetail(node) {
    const detail = node.detail;
    if (!detail) return;
    const { emoji, text } = splitTopic(node.topic);
    const meta = PART_META[detail.part] || PART_META[0];
    elEmoji.textContent = emoji;
    elTitle.textContent = text;
    elTerm.textContent = detail.term || "";
    elCrumb.textContent = meta.label;
    elCrumb.style.setProperty("--part-accent", "var(" + meta.accent + ")");
    elCrumb.style.setProperty("--part-soft", "var(" + meta.soft + ")");
    elSummary.innerHTML = "";
    const p = document.createElement("p");
    p.textContent = detail.summary;
    elSummary.appendChild(p);
    if (detail.href) {
      elLink.href = detail.href;
      elFoot.hidden = false;
    } else {
      elFoot.hidden = true;
    }
    panel.hidden = false;
    requestAnimationFrame(() => body.classList.add("detail-open"));
  }

  function closeDetail() {
    body.classList.remove("detail-open");
    window.setTimeout(() => { panel.hidden = true; }, 240);
  }

  mind.bus.addListener("selectNode", node => openDetail(node));
  mind.bus.addListener("selectNodes", nodes => {
    if (nodes && nodes.length === 1) openDetail(nodes[0]);
  });

  window.mindInstance = mind;

  closeBtn.addEventListener("click", closeDetail);
  backdrop.addEventListener("click", closeDetail);
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && body.classList.contains("detail-open")) closeDetail();
  });
})();
</script>
